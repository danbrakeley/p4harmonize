services:
  ## server pair 1: case insensitive src, but case sensitive dst
  p4src1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_ID: src1
        CASE_INSENSITIVE: 1
    restart: unless-stopped
    ports:
      - 1671:1666
  p4dst1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_ID: dst1
        CASE_INSENSITIVE: 0
    restart: unless-stopped
    ports:
      - 1681:1666
  ## server pair 2: case insensitive on both src and dst
  p4src2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_ID: src2
        CASE_INSENSITIVE: 1
    restart: unless-stopped
    ports:
      - 1672:1666
  p4dst2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_ID: dst2
        CASE_INSENSITIVE: 1
    restart: unless-stopped
    ports:
      - 1682:1666
  ## server pair 3: case insensitive on both, longtest will not use streams on dst
  p4src3:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_ID: src3
        CASE_INSENSITIVE: 1
    restart: unless-stopped
    ports:
      - 1673:1666
  p4dst3:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_ID: dst3
        CASE_INSENSITIVE: 1
    restart: unless-stopped
    ports:
      - 1683:1666
